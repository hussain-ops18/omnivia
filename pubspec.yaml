name: stopsafe
description: StopSafe - Smart Travel Safety App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  audioplayers: ^5.2.1
  geolocator: ^11.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.0.15
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.5
  google_maps_flutter: ^2.5.0
  geocoding: ^2.1.0
  http: ^1.2.0
  flutter_launcher_icons: ^0.13.1
  battery_plus: ^5.0.3
  sensors_plus: ^4.0.2
  flutter_blue_plus: ^1.32.12
  wifi_scan: ^0.4.1
  connectivity_plus: ^6.0.3
flutter_polyline_points: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/alarm.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"